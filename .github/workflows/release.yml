name: Publish PandaMap release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: pandamap-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Validate the addon version
        shell: bash
        run: |
          toc_version="$(sed -n 's/^## Version: //p' pandaMap.toc | tr -d '\r')"
          tag_version="${GITHUB_REF_NAME#v}"

          test -n "$toc_version"
          test "$toc_version" = "$tag_version"
          python3 -B tools/release.py check --release "$tag_version"
          python3 -B tools/release.py notes "$tag_version" > release-notes.md

      - name: Package PandaMap
        shell: bash
        run: |
          mkdir -p package/pandaMap

          # Everything the client loads at runtime. Packs/ holds the HD map
          # tiles; build/audit scripts, docs and tools stay out of the zip.
          cp -R Locales Media Packs package/pandaMap/
          cp *.lua pandaMap.toc README.md CHANGELOG.md package/pandaMap/

          # Guard against this copy list drifting from the .toc: every file
          # the .toc lists must exist inside the package.
          missing=0
          for entry in $(sed -e 's/\r$//' -e 's/#.*//' pandaMap.toc | tr '\\' '/'); do
            if [ ! -f "package/pandaMap/$entry" ]; then
              echo "missing from package: $entry"
              missing=1
            fi
          done
          test "$missing" -eq 0

          (
            cd package
            zip -r ../PandaMap.zip pandaMap
          )

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" PandaMap.zip \
            --verify-tag \
            --title "PandaMap ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --latest
