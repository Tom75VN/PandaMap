name: Publish PandaMap release

on:
  push:
    tags:
      - "v*"
      - "world-v*"
      - "unexplored-v*"
      - "terrain-v*"

permissions:
  contents: write

concurrency:
  group: pandamap-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Identify and validate the component
        id: component
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            world-v*)
              component="world"
              folder="PandaMap_World"
              archive="PandaMap-World.zip"
              version="${GITHUB_REF_NAME#world-v}"
              title="PandaMap World Maps $version"
              ;;
            unexplored-v*)
              component="unexplored"
              folder="PandaMap_Unexplored"
              archive="PandaMap-Unexplored.zip"
              version="${GITHUB_REF_NAME#unexplored-v}"
              title="PandaMap Unexplored Maps $version"
              ;;
            terrain-v*)
              component="terrain"
              folder="PandaMap_Terrain"
              archive="PandaMap-Terrain.zip"
              version="${GITHUB_REF_NAME#terrain-v}"
              title="PandaMap 3D Terrain $version"
              ;;
            v*)
              component="core"
              folder="pandaMap"
              archive="PandaMap.zip"
              version="${GITHUB_REF_NAME#v}"
              title="PandaMap $version"
              ;;
            *)
              echo "unsupported release tag: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

          if [ "$component" = "core" ]; then
            toc_version="$(sed -n 's/^## Version: //p' pandaMap.toc | tr -d '\r')"
            test "$toc_version" = "$version"
            python3 -B tools/release.py check --release "$version"
            python3 -B tools/release.py notes "$version" > release-notes.md
          else
            toc="Packs/$folder/$folder.toc"
            toc_version="$(sed -n 's/^## Version: //p' "$toc" | tr -d '\r')"
            test -n "$toc_version"
            test "$toc_version" = "$version"
            printf '%s\n\n%s\n' \
              "Install this map pack beside the PandaMap core addon." \
              "Existing core and other map-pack folders do not need replacing." \
              > release-notes.md
          fi

          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Package the core addon
        if: steps.component.outputs.component == 'core'
        shell: bash
        run: |
          mkdir -p package/pandaMap
          cp -R Locales Media package/pandaMap/
          cp *.lua README.md CHANGELOG.md package/pandaMap/

          # Source checkouts load nested packs for development. Published
          # installs use the independently packaged top-level addons.
          grep -vF 'Packs\LegacyPacks.lua' pandaMap.toc \
            > package/pandaMap/pandaMap.toc

          missing=0
          for entry in $(sed -e 's/\r$//' -e 's/#.*//' \
              package/pandaMap/pandaMap.toc | tr '\\' '/'); do
            if [ ! -f "package/pandaMap/$entry" ]; then
              echo "missing from core package: $entry"
              missing=1
            fi
          done
          test "$missing" -eq 0

          (
            cd package
            zip -r "../${{ steps.component.outputs.archive }}" pandaMap
          )

      - name: Package the map addon
        if: steps.component.outputs.component != 'core'
        shell: bash
        run: |
          folder="${{ steps.component.outputs.folder }}"
          archive="${{ steps.component.outputs.archive }}"
          mkdir -p package
          cp -R "Packs/$folder" "package/$folder"

          missing=0
          for entry in $(sed -e 's/\r$//' -e 's/#.*//' \
              "package/$folder/$folder.toc" | tr '\\' '/'); do
            if [ ! -f "package/$folder/$entry" ]; then
              echo "missing from $folder package: $entry"
              missing=1
            fi
          done
          test "$missing" -eq 0

          (
            cd package
            zip -r "../$archive" "$folder"
          )

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          latest="--latest=false"
          if [ "${{ steps.component.outputs.component }}" = "core" ]; then
            latest="--latest"
          fi
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.component.outputs.archive }}" \
            --verify-tag \
            --title "${{ steps.component.outputs.title }}" \
            --notes-file release-notes.md \
            "$latest"
